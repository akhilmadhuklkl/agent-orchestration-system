name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: python -m pytest -q

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local stack
        run: docker compose up -d --build

      - name: Wait for API
        run: curl --fail --retry 20 --retry-delay 3 http://localhost:8002/health

      - name: Verify model status
        run: |
          curl --fail http://localhost:8002/model-status
          curl --fail http://localhost:8002/metrics

      - name: Verify end-to-end task workflow
        run: |
          task=$(curl --fail -s -X POST http://localhost:8002/tasks \
            -H 'Content-Type: application/json' \
            -d '{"description":"CI integration task"}')
          task_id=$(echo "$task" | jq -r '.task_id')
          status=$(echo "$task" | jq -r '.status')
          test "$status" = "awaiting_approval"
          curl --fail -s -X POST "http://localhost:8002/tasks/$task_id/approval" \
            -H 'Content-Type: application/json' \
            -d '{"approved":true}' > /dev/null
          for attempt in {1..20}; do
            result=$(curl --fail -s "http://localhost:8002/tasks/$task_id")
            status=$(echo "$result" | jq -r '.status')
            if [ "$status" = "completed" ]; then
              echo "$result"
              exit 0
            fi
            sleep 2
          done
          echo "Task did not complete: $result"
          exit 1

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down -v
